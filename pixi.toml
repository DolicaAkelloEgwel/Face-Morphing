[workspace]
authors = ["DolicaAkelloEgwel <d.egwel@gmail.com>"]
channels = ["conda-forge"]
name = "Face-Morphing"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
demo = "python code/__init__.py --images demo-images --output output.mp4"

[dependencies]
ffmpeg = ">=9.0.2,<10"
numpy = ">=2.5.4,<3"
scikit-image = ">=0.26.0,<0.27"
pillow = ">=12.3.0,<13"
dlib = ">=20.0.1,<21"
py-opencv = ">=5.0.0,<6"
ffmpeg-python = ">=0.2.0,<0.3"
imutils = ">=0.5.4,<0.6"
